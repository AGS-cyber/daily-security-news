name: daily

on:
  schedule:
    # 12:00 UTC = 08:00 US Eastern (design §9)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm start
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # The push is the deploy: Vercel's Git integration builds `main` on every
      # commit. There is no deploy job here on purpose (design §9).
      - name: Commit site and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site data
          git diff --staged --quiet || git commit -m "edition: $(date -u +%Y-%m-%d)"
          git push
